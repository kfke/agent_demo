services:
  nda-guard:
    build: .
    image: kfke/agent-demo:local
    env_file:
      - .env
    environment:
      PYTHONUTF8: ${PYTHONUTF8:-1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4.1-mini}
    command: ["python", "demo.py"]

  nda-guard-openai:
    build: .
    image: kfke/agent-demo:local
    env_file:
      - .env
    environment:
      PYTHONUTF8: ${PYTHONUTF8:-1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4.1-mini}
    command: ["python", "demo.py", "--openai"]

  tests:
    build: .
    image: kfke/agent-demo:local
    env_file:
      - .env
    command: ["python", "-m", "pytest", "test_policy.py", "test_reliability.py", "-q"]
